<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --border: #2a3140;
    --accent: #ffb300;
    --green: #4caf50;
    --red: #e53935;
    --text: #e8eaf0;
    --muted: #8a93a6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1c2430 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 100%;
    padding: 20px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: 26px;
    letter-spacing: 6px;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 179, 0, 0.35), 0 2px 0 #7a5400;
  }
  h1 small { font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 500; }

  .hud {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }
  .hud-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    min-width: 74px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .hud-item .label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .hud-item .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .hud-item .icons { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 20px; align-items: center; }
  .hud-item canvas { display: block; }

  #stage {
    position: relative;
    border: 3px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px rgba(0,0,0,0.55);
    background: #000;
    line-height: 0;
  }
  canvas#game { display: block; border-radius: 7px; touch-action: none; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    background: rgba(8, 10, 16, 0.82);
    border-radius: 7px;
    backdrop-filter: blur(3px);
    padding: 20px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay .big {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 8px;
    color: var(--accent);
    text-shadow: 0 0 22px rgba(255,179,0,0.4);
  }
  .overlay .sub { color: var(--muted); font-size: 14px; max-width: 420px; line-height: 1.7; }
  .overlay .score-line { font-size: 18px; color: var(--text); }
  .overlay .score-line b { color: var(--accent); }
  .overlay button {
    background: linear-gradient(180deg, #ffcf4d, #f5a300);
    color: #201400;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b97b00, 0 8px 18px rgba(0,0,0,0.4);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .overlay button:hover { filter: brightness(1.05); }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b97b00; }

  .keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 4px 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: left;
  }
  .keys kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 12px;
    color: var(--text);
    font-family: inherit;
    justify-self: end;
  }

  .hint { font-size: 12px; color: var(--muted); letter-spacing: 1px; }

  /* touch controls */
  #touch {
    display: none;
    width: 100%;
    max-width: 640px;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  #touch .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
  }
  #touch button {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #touch button:active { background: rgba(255,255,255,0.2); }
  #touch .fire {
    width: 96px; height: 96px;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    background: rgba(229,57,53,0.25);
    border-color: var(--red);
    color: #ff8a80;
  }
  #touch .empty { visibility: hidden; }

  @media (pointer: coarse) {
    #touch { display: flex; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <h1>坦克大战 <small>TANK BATTLE</small></h1>

  <div class="hud">
    <div class="hud-item"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="hud-item"><span class="label">Hi-Score</span><span class="value" id="hiscore">0</span></div>
    <div class="hud-item"><span class="label">Lives</span><div class="icons" id="lives"></div></div>
    <div class="hud-item"><span class="label">Level</span><span class="value" id="level">1</span></div>
    <div class="hud-item"><span class="label">Enemies</span><div class="icons" id="enemies"></div></div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>

    <div class="overlay" id="title">
      <div class="big">坦克大战</div>
      <div class="sub">消灭所有敌军坦克，同时守住你的基地。<br>基地被摧毁或生命耗尽即告失败。</div>
      <div class="keys">
        <kbd>W A S D / 方向键</kbd><span>移动</span>
        <kbd>Space / J</kbd><span>开火</span>
        <kbd>P</kbd><span>暂停</span>
      </div>
      <button id="btnStart">开始游戏</button>
    </div>

    <div class="overlay hidden" id="pause">
      <div class="big">已暂停</div>
      <div class="sub">按 <kbd>P</kbd> 或点击按钮继续</div>
      <button id="btnResume">继续</button>
    </div>

    <div class="overlay hidden" id="gameover">
      <div class="big" style="color:#ff6b5e">游戏结束</div>
      <div class="score-line">得分 <b id="finalScore">0</b></div>
      <button id="btnRestart">再来一局</button>
    </div>

    <div class="overlay hidden" id="win">
      <div class="big" style="color:#69f0ae">胜利！</div>
      <div class="score-line">最终得分 <b id="winScore">0</b></div>
      <button id="btnAgain">再玩一次</button>
    </div>
  </div>

  <div id="touch">
    <div class="dpad">
      <button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button>
      <button data-dir="left">◀</button><button class="empty"></button><button data-dir="right">▶</button>
      <button class="empty"></button><button data-dir="down">▼</button><button class="empty"></button>
    </div>
    <button class="fire" id="btnFire">开火</button>
  </div>

  <div class="hint">WASD / 方向键 移动 · 空格 开火 · P 暂停</div>

<script>
(function () {
  "use strict";

  // ---------- 常量 ----------
  const TILE = 48;
  const COLS = 13, ROWS = 13;
  const W = COLS * TILE, H = ROWS * TILE;   // 624 x 624
  const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  const EMPTY = 0, BRICK = 1, STEEL = 2, BASE = 3;
  const PLAYER_SPEED = 2.6;
  const ENEMY_SPEED = 1.5;
  const BULLET_SPEED = 6.5;
  const BULLET = 8;
  const LEVEL_ENEMIES = 10;

  // ---------- 关卡地图 ----------
  const MAPS = [
    [
      ".............",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".#.#...#.#.#.",
      ".#.#.#.#.#.#.",
      ".....###.....",
      "..@..#.#..@..",
      ".....###.....",
      ".#.#.#.#.#.#.",
      ".#.#...#.#.#.",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".....#B#....."
    ],
    [
      ".............",
      ".#.#.#@#.#.#.",
      ".#.#.#.#.#.#.",
      ".....@.@.....",
      ".#.#.#.#.#.#.",
      ".@.#.###.#.@.",
      ".....@#@.....",
      ".#.#.###.#.#.",
      ".#.#.#.#.#.#.",
      ".....@.@.....",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".....#B#....."
    ],
    [
      ".............",
      ".#.#.#.#.#.#.",
      ".@.#.#.#.#.@.",
      ".....@#@.....",
      ".#.#.#.#.#.#.",
      ".#.@.#.@.#.#.",
      ".....#.#.....",
      ".#.@.#.@.#.#.",
      ".#.#.#.#.#.#.",
      ".....@#@.....",
      ".@.#.#.#.#.@.",
      ".#.#.#.#.#.#.",
      ".....#B#....."
    ]
  ];

  // ---------- DOM ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const elScore = document.getElementById("score");
  const elHiScore = document.getElementById("hiscore");
  const elLevel = document.getElementById("level");
  const elLives = document.getElementById("lives");
  const elEnemies = document.getElementById("enemies");

  // ---------- 状态 ----------
  let state = "title";               // title | playing | paused | gameover | win
  let map = [];
  let score = 0, lives = 3, level = 1;
  let hiScore = parseInt(localStorage.getItem("tank-hiscore") || "0", 10) || 0;
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let shake = 0;

  let toSpawn = 0, spawnTimer = 0;
  let levelBanner = 0;               // frames left to show "LEVEL N"
  let transitioning = false;         // 关卡切换防重入

  // ---------- 输入 ----------
  const keys = {};
  const dirTimes = {};
  const DIR_KEYS = {
    ArrowUp: UP, KeyW: UP, ArrowDown: DOWN, KeyS: DOWN,
    ArrowLeft: LEFT, KeyA: LEFT, ArrowRight: RIGHT, KeyD: RIGHT
  };
  const touchDir = { up: false, down: false, left: false, right: false };

  window.addEventListener("keydown", function (e) {
    if (DIR_KEYS[e.code] !== undefined || e.code === "Space" || e.code === "KeyJ" || e.code === "KeyP") {
      e.preventDefault();
    }
    if (e.code === "KeyP") { togglePause(); return; }
    keys[e.code] = true;
    if (DIR_KEYS[e.code] !== undefined) dirTimes[e.code] = performance.now();
    if ((e.code === "Space" || e.code === "KeyJ") && state === "playing") { tryFirePlayer(); }
    if (state === "title" && (e.code === "Enter" || e.code === "Space")) { startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    keys[e.code] = false;
    delete dirTimes[e.code];
  });

  // 触摸
  document.querySelectorAll("#touch [data-dir]").forEach(function (btn) {
    const d = btn.getAttribute("data-dir");
    const on = function (v) { return function () { touchDir[d] = v; }; };
    btn.addEventListener("touchstart", on(true), { passive: true });
    btn.addEventListener("touchend", on(false), { passive: true });
    btn.addEventListener("mousedown", on(true));
    btn.addEventListener("mouseup", on(false));
    btn.addEventListener("mouseleave", on(false));
  });
  document.getElementById("btnFire").addEventListener("touchstart", function () { tryFirePlayer(); }, { passive: true });
  document.getElementById("btnFire").addEventListener("mousedown", function () { tryFirePlayer(); });

  // 按钮
  document.getElementById("btnStart").addEventListener("click", startGame);
  document.getElementById("btnResume").addEventListener("click", function () { state = "playing"; showOverlay(null); });
  document.getElementById("btnRestart").addEventListener("click", startGame);
  document.getElementById("btnAgain").addEventListener("click", startGame);

  // ---------- 音效 ----------
  let audio = null;
  function initAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audio = null; }
    }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audio) return;
    type = type || "square"; vol = vol || 0.14;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  }
  const sfx = {
    shoot: function () { beep(520, 0.08, "square", 0.08); },
    boom: function () { beep(120, 0.28, "sawtooth", 0.18); beep(60, 0.4, "triangle", 0.16); },
    hit: function () { beep(900, 0.05, "square", 0.05); },
    brick: function () { beep(200, 0.1, "square", 0.08); }
  };

  // ---------- 工具 ----------
  function rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function tileAt(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return STEEL; // 边界视为钢墙
    return map[row][col];
  }
  function boxCollides(x, y, w, h) {
    const c0 = Math.floor(x / TILE), r0 = Math.floor(y / TILE);
    const c1 = Math.floor((x + w - 1) / TILE), r1 = Math.floor((y + h - 1) / TILE);
    for (let r = r0; r <= r1; r++)
      for (let c = c0; c <= c1; c++)
        if (tileAt(c, r) !== EMPTY) return true;
    return false;
  }
  function tanksOverlap(x, y, self) {
    const all = [player].concat(enemies);
    for (let i = 0; i < all.length; i++) {
      const t = all[i];
      if (t === self || !t || t.state === "spawn") continue;
      if (x < t.x + TILE && x + TILE > t.x && y < t.y + TILE && y + TILE > t.y) return true;
    }
    return false;
  }
  function moveTank(tank, dx, dy) {
    if (dx !== 0) {
      const nx = tank.x + dx;
      if (!boxCollides(nx, tank.y, TILE, TILE) && !tanksOverlap(nx, tank.y, tank)) tank.x = nx;
      else tank.blocked = true;
    }
    if (dy !== 0) {
      const ny = tank.y + dy;
      if (!boxCollides(tank.x, ny, TILE, TILE) && !tanksOverlap(tank.x, ny, tank)) tank.y = ny;
      else tank.blocked = true;
    }
  }
  function muzzle(tank) {
    const cx = tank.x + TILE / 2, cy = tank.y + TILE / 2;
    const s = BULLET / 2;
    switch (tank.dir) {
      case UP: return { x: cx - s, y: tank.y - BULLET };
      case DOWN: return { x: cx - s, y: tank.y + TILE };
      case LEFT: return { x: tank.x - BULLET, y: cy - s };
      case RIGHT: return { x: tank.x + TILE, y: cy - s };
    }
  }

  // ---------- 游戏流程 ----------
  function startGame() {
    initAudio();
    score = 0; lives = 3; level = 1;
    state = "playing";
    showOverlay(null);
    startLevel();
    updateHUD();
  }
  function startLevel() {
    map = MAPS[Math.min(level - 1, MAPS.length - 1)].map(function (row) {
      return row.split("").map(function (ch) {
        return ch === "#" ? BRICK : ch === "@" ? STEEL : ch === "B" ? BASE : EMPTY;
      });
    });
    player = makePlayer();
    enemies = [];
    bullets = [];
    particles = [];
    toSpawn = LEVEL_ENEMIES;
    spawnTimer = 30;
    levelBanner = 120;
    transitioning = false;
  }
  function makePlayer() {
    return { x: 6 * TILE, y: 11 * TILE, dir: UP, cooldown: 0, invincible: 120, blocked: false };
  }
  function spawnEnemy() {
    const points = [{ col: 0, row: 0 }, { col: 6, row: 0 }, { col: 12, row: 0 }];
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const x = p.col * TILE, y = p.row * TILE;
      if (!boxCollides(x, y, TILE, TILE) && !tanksOverlap(x, y, null)) {
        enemies.push({
          x: x, y: y, dir: DOWN, state: "spawn", spawnTime: 70,
          turnTimer: 60 + Math.random() * 60 | 0,
          shootTimer: 50 + Math.random() * 120 | 0,
          blocked: false
        });
        toSpawn--;
        return;
      }
    }
    // 没有空位则稍后重试
  }
  function nextLevel() {
    level++;
    if (level > MAPS.length) { winGame(); return; }
    startLevel();
    updateHUD();
  }
  function gameOver() {
    state = "gameover";
    hiScore = Math.max(hiScore, score);
    localStorage.setItem("tank-hiscore", String(hiScore));
    document.getElementById("finalScore").textContent = score;
    showOverlay("gameover");
    updateHUD();
  }
  function winGame() {
    state = "win";
    hiScore = Math.max(hiScore, score);
    localStorage.setItem("tank-hiscore", String(hiScore));
    document.getElementById("winScore").textContent = score;
    showOverlay("win");
    updateHUD();
  }
  function togglePause() {
    if (state === "playing") { state = "paused"; showOverlay("pause"); }
    else if (state === "paused") { state = "playing"; showOverlay(null); }
  }
  function showOverlay(id) {
    ["title", "pause", "gameover", "win"].forEach(function (n) {
      document.getElementById(n).classList.toggle("hidden", n !== id);
    });
  }

  // ---------- 开火 ----------
  function tryFirePlayer() {
    if (state !== "playing" || !player || player.cooldown > 0) return;
    const own = bullets.filter(function (b) { return b.owner === "player"; }).length;
    if (own >= 2) return;
    const m = muzzle(player);
    bullets.push({ x: m.x, y: m.y, dir: player.dir, owner: "player", speed: BULLET_SPEED });
    player.cooldown = 16;
    sfx.shoot();
  }
  function fireEnemy(e) {
    const m = muzzle(e);
    bullets.push({ x: m.x, y: m.y, dir: e.dir, owner: "enemy", speed: BULLET_SPEED * 0.68 });
    sfx.shoot();
  }

  // ---------- 粒子 ----------
  function burst(x, y, color) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 20 | 0, max: 40, color: color
      });
    }
  }

  // ---------- 更新 ----------
  function getDir() {
    // 键盘
    let best = null, bt = -1;
    for (const code in DIR_KEYS) {
      if (keys[code] && dirTimes[code] !== undefined && dirTimes[code] > bt) {
        bt = dirTimes[code]; best = DIR_KEYS[code];
      }
    }
    // 触摸覆盖
    if (touchDir.up && !touchDir.down) best = UP;
    else if (touchDir.down && !touchDir.up) best = DOWN;
    if (touchDir.left && !touchDir.right) best = LEFT;
    else if (touchDir.right && !touchDir.left) best = RIGHT;
    return best;
  }

  function update() {
    if (levelBanner > 0) levelBanner--;

    // 玩家
    if (player) {
      const d = getDir();
      if (d !== null) {
        player.dir = d;
        moveTank(player, DX[d] * PLAYER_SPEED, DY[d] * PLAYER_SPEED);
      }
      if (player.cooldown > 0) player.cooldown--;
      if (player.invincible > 0) player.invincible--;
      if ((keys["Space"] || keys["KeyJ"]) && player.cooldown <= 0) tryFirePlayer();
    }

    // 生成敌军
    if (spawnTimer > 0) spawnTimer--;
    if (toSpawn > 0 && spawnTimer <= 0 && enemies.length < 3) {
      spawnEnemy();
      spawnTimer = 110;
    }

    // 敌军 AI
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.state === "spawn") {
        e.spawnTime--;
        if (e.spawnTime <= 0) e.state = "active";
        continue;
      }
      e.blocked = false;
      const step = ENEMY_SPEED;
      const ox = e.x, oy = e.y;
      moveTank(e, DX[e.dir] * step, DY[e.dir] * step);
      e.turnTimer--;
      e.shootTimer--;
      if ((e.blocked || (e.x === ox && e.y === oy)) || e.turnTimer <= 0) {
        // 转向：偏向朝玩家方向
        const r = Math.random();
        if (r < 0.45) e.dir = aimAt(e, player);
        else e.dir = Math.random() * 4 | 0;
        e.turnTimer = 60 + Math.random() * 120 | 0;
      }
      if (e.shootTimer <= 0 && e.state === "active") {
        const dxp = player.x - e.x, dyp = player.y - e.y;
        const alignedX = Math.abs(dyp) < TILE * 0.7;
        const alignedY = Math.abs(dxp) < TILE * 0.7;
        if (alignedX || alignedY || Math.random() < 0.5) {
          if (alignedX || alignedY) e.dir = aimAt(e, player);
          fireEnemy(e);
        }
        e.shootTimer = 90 + Math.random() * 160 | 0;
      }
    }

    updateBullets();

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake--;

    // 胜利判定
    if (!transitioning && toSpawn <= 0 && enemies.length === 0) {
      transitioning = true;
      setTimeout(function () { transitioning = false; nextLevel(); }, 700);
    }
    updateHUD();
  }

  function aimAt(e, target) {
    const dx = target.x - e.x, dy = target.y - e.y;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? RIGHT : LEFT;
    return dy > 0 ? DOWN : UP;
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;

      let dead = false;

      // 出界
      if (b.x < -BULLET || b.y < -BULLET || b.x > W || b.y > H) dead = true;

      // 地图碰撞
      if (!dead) {
        const c0 = Math.floor(b.x / TILE), r0 = Math.floor(b.y / TILE);
        const c1 = Math.floor((b.x + BULLET - 1) / TILE), r1 = Math.floor((b.y + BULLET - 1) / TILE);
        outer:
        for (let r = r0; r <= r1; r++) {
          for (let c = c0; c <= c1; c++) {
            const t = tileAt(c, r);
            if (t === EMPTY) continue;
            if (t === BRICK) {
              map[r][c] = EMPTY;
              burst(c * TILE + TILE / 2, r * TILE + TILE / 2, "#c87f4a");
              sfx.brick();
              dead = true;
              break outer;
            } else if (t === STEEL) {
              burst(b.x + BULLET / 2, b.y + BULLET / 2, "#cfd8dc");
              sfx.hit();
              dead = true;
              break outer;
            } else if (t === BASE) {
              map[r][c] = EMPTY;
              burst(c * TILE + TILE / 2, r * TILE + TILE / 2, "#ffb300");
              shake = 14;
              sfx.boom();
              dead = true;
              gameOver();
              break outer;
            }
          }
        }
      }

      // 坦克碰撞
      if (!dead) {
        if (b.owner === "player") {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (e.state !== "active") continue;
            if (b.x < e.x + TILE && b.x + BULLET > e.x && b.y < e.y + TILE && b.y + BULLET > e.y) {
              burst(e.x + TILE / 2, e.y + TILE / 2, "#ff7043");
              enemies.splice(j, 1);
              score += 100;
              shake = 8;
              sfx.boom();
              dead = true;
              break;
            }
          }
        } else {
          if (player && player.invincible <= 0) {
            if (b.x < player.x + TILE && b.x + BULLET > player.x && b.y < player.y + TILE && b.y + BULLET > player.y) {
              burst(player.x + TILE / 2, player.y + TILE / 2, "#4caf50");
              lives--;
              shake = 12;
              sfx.boom();
              dead = true;
              if (lives <= 0) { player = null; gameOver(); }
              else { player = makePlayer(); }
            }
          }
        }
      }

      // 子弹相撞抵消
      if (!dead) {
        for (let j = 0; j < bullets.length; j++) {
          if (j === i) continue;
          const o = bullets[j];
          if (o.owner === b.owner) continue;
          if (b.x < o.x + BULLET && b.x + BULLET > o.x && b.y < o.y + BULLET && b.y + BULLET > o.y) {
            burst(b.x + BULLET / 2, b.y + BULLET / 2, "#ffffff");
            o.dead = true;
            dead = true;
            break;
          }
        }
      }

      if (dead || b.dead) bullets.splice(i, 1);
    }
  }

  // ---------- HUD ----------
  function updateHUD() {
    elScore.textContent = score;
    elHiScore.textContent = hiScore;
    elLevel.textContent = level;
    drawIcons(elLives, lives, "#4caf50");
    drawIcons(elEnemies, toSpawn + enemies.length, "#e53935");
  }
  function drawIcons(container, count, color) {
    const n = Math.max(0, Math.min(count, 12));
    while (container.firstChild) container.removeChild(container.firstChild);
    for (let i = 0; i < n; i++) {
      const c = document.createElement("canvas");
      c.width = 20; c.height = 20;
      const g = c.getContext("2d");
      g.fillStyle = "#11161f";
      rr(g, 0, 0, 20, 20, 4); g.fill();
      g.fillStyle = color;
      g.fillRect(3, 3, 4, 14); g.fillRect(13, 3, 4, 14);
      rr(g, 6, 6, 8, 8, 2); g.fill();
      g.fillRect(9, 2, 2, 6);
      container.appendChild(c);
    }
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 地面
    ctx.fillStyle = "#10141c";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * TILE, 0); ctx.lineTo(c * TILE, H); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * TILE); ctx.lineTo(W, r * TILE); ctx.stroke();
    }

    // 地图
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        if (t === BRICK) drawBrick(c * TILE, r * TILE);
        else if (t === STEEL) drawSteel(c * TILE, r * TILE);
        else if (t === BASE) drawBase(c * TILE, r * TILE);
      }
    }

    // 敌人
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.state === "spawn") drawSpawn(e.x + TILE / 2, e.y + TILE / 2);
      else drawTank(e.x, e.y, e.dir, "#e53935", "#8c1f1a", "#ff8a80");
    }

    // 玩家
    if (player) {
      if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }
      drawTank(player.x, player.y, player.dir, "#4caf50", "#245c2c", "#a5d6a7");
      ctx.globalAlpha = 1;
    }

    // 子弹
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillStyle = b.owner === "player" ? "#fff59d" : "#ffab91";
      ctx.shadowColor = b.owner === "player" ? "#fff59d" : "#ff5722";
      ctx.shadowBlur = 8;
      ctx.fillRect(b.x, b.y, BULLET, BULLET);
      ctx.shadowBlur = 0;
    }

    // 粒子
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // 关卡横幅
    if (levelBanner > 0 && state === "playing") {
      const a = levelBanner > 100 ? (120 - levelBanner) / 20 : levelBanner / 40;
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.fillStyle = "#ffb300";
      ctx.font = "800 44px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("LEVEL " + level, W / 2, H / 2 - 10);
      ctx.globalAlpha = 1;
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#8c4a2f";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#6b3620";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
    // 砖纹
    ctx.strokeStyle = "#6b3620";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
    ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
    ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
    ctx.moveTo(x + TILE * 3 / 4, y + TILE / 2); ctx.lineTo(x + TILE * 3 / 4, y + TILE);
    ctx.stroke();
  }
  function drawSteel(x, y) {
    ctx.fillStyle = "#8fa3ad";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#b9c8d0";
    ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.strokeStyle = "#5c6e78";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = "#5c6e78";
    [[10, 10], [TILE - 10, 10], [10, TILE - 10], [TILE - 10, TILE - 10]].forEach(function (p) {
      ctx.beginPath(); ctx.arc(x + p[0], y + p[1], 3, 0, Math.PI * 2); ctx.fill();
    });
  }
  function drawBase(x, y) {
    ctx.fillStyle = "#1a2030";
    ctx.fillRect(x, y, TILE, TILE);
    // 金色徽章
    ctx.fillStyle = "#ffb300";
    ctx.beginPath();
    ctx.arc(x + TILE / 2, y + TILE / 2, TILE * 0.34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7a5400";
    ctx.beginPath();
    ctx.arc(x + TILE / 2, y + TILE / 2, TILE * 0.34, 0, Math.PI * 2);
    ctx.stroke();
    // 星
    ctx.fillStyle = "#fff8e1";
    star(x + TILE / 2, y + TILE / 2, TILE * 0.22, 5);
  }
  function star(cx, cy, r, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const a = -Math.PI / 2 + i * Math.PI / points;
      const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }
  function drawSpawn(cx, cy) {
    const flash = Math.floor(Date.now() / 80) % 2 === 0;
    ctx.fillStyle = flash ? "#ffffff" : "#ffb300";
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * TILE * 0.5, Math.sin(a) * TILE * 0.5);
      ctx.lineTo(Math.cos(a + Math.PI / 4) * TILE * 0.2, Math.sin(a + Math.PI / 4) * TILE * 0.2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function drawTank(x, y, dir, body, track, accent) {
    ctx.save();
    ctx.translate(x + TILE / 2, y + TILE / 2);
    ctx.rotate(dir * Math.PI / 2);
    const s = TILE;
    // 履带
    ctx.fillStyle = track;
    rr(ctx, -s / 2, -s / 2, s * 0.28, s, 4); ctx.fill();
    rr(ctx, s / 2 - s * 0.28, -s / 2, s * 0.28, s, 4); ctx.fill();
    // 履带纹
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    for (let i = 0; i < 4; i++) {
      const ty = -s / 2 + 6 + i * (s - 12) / 3;
      ctx.fillRect(-s / 2 + 3, ty, s * 0.28 - 6, 3);
      ctx.fillRect(s / 2 - s * 0.28 + 3, ty, s * 0.28 - 6, 3);
    }
    // 车身
    ctx.fillStyle = body;
    rr(ctx, -s * 0.30, -s * 0.36, s * 0.60, s * 0.74, 5); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    rr(ctx, -s * 0.30, -s * 0.36, s * 0.60, s * 0.2, 4); ctx.fill();
    // 炮塔
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1.5;
    ctx.stroke();
    // 炮管
    ctx.fillStyle = body;
    ctx.fillRect(-s * 0.055, -s * 0.52, s * 0.11, s * 0.34);
    ctx.restore();
  }

  // ---------- 主循环 ----------
  let last = 0, acc = 0;
  const STEP = 1 / 60;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    while (acc >= STEP) {
      if (state === "playing") update();
      acc -= STEP;
    }
    render();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
